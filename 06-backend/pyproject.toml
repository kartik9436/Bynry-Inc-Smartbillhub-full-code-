name = "smartbillhub"
# THE PRODUCT VERSION — `<release>.<change>.<fix>`, change process step 7
# (12-governance/13-change-process.md, PO-ruled 2026-08-16). Allocated
# 2026-08-17: release 2 (R2) · change 7 (CR-007 SET-09/10 templates, the most
# recent CR to land code) · fix 0 (no defect has been fixed ON TOP of CR-007 —
# DEF-191 was introduced by CR-007's own backend commit and fixed inside it,
# and DEF-190's remainder is a rewiring nobody has taken).
# ⚠ MOVED 2.344.0 → 2.7.0 with CR-007, and BOTH literals moved in the same commit
# because nothing yet asserts they agree (see below). This replaces `0.1.0`, which was
# scaffolding and had never moved; the state step 7 was written about was "the
# backend carries no version at all".
#
# ⚠ THIS LINE IS A DERIVED COPY, NOT THE SOURCE. The source of truth is
# `07-frontend/package.json`'s `version` field — that is the number the running
# app reads and shows a user (AppShell.tsx), and it is the file the PO's own
# complaint names. Python packaging cannot read a version out of a JSON file in
# a SIBLING docker build context (`./06-backend` and `./07-frontend` are
# separate contexts, docker-compose.yml), and setuptools' `dynamic = ["version"]`
# can only read a file inside this project directory or an attribute of an
# importable module — so the number cannot be derived here without adding a
# THIRD copy, which is hard-won law 5 pointing the wrong way.
#
# So it is two literals and one owed guard, stated rather than hidden (law 1):
# NOTHING FAILS TODAY IF THESE TWO DISAGREE. The gate that would close it —
# assert `pyproject.version == package.json.version`, and refuse a CR marked
# done with no version, which change process §7 rule 4 requires and
# `10-scripts/gates/` does not have — is recorded as owed in
# 12-governance/11-change-requests.md (CR-004 §7). Until it exists, moving one
# of these two lines means moving the other in the same commit.
#
# 2.7.4 — CR-007's disconnect defaults (2026-08-17). `<release>.<change>.<fix>`:
# R2, CR-007, fix 4. It is a FIX level rather than a change level because the
# CR itself already landed at 2.7.0; what this build adds is the three tier
# bodies and the five rights clauses the CR could not ship until the PO ruled
# who writes them, plus DEF-193's open remainder (the ladder now selects by
# tier). Both literals moved in this commit, which is still the only thing
# keeping them equal — the gate that would assert it is owed and unbuilt.
#
# ⚠ 2.18.0 — THE PREDICTED FAILURE HAPPENED, AND THIS IS THE REPAIR (DEF-242,
# 2026-08-18). The paragraph above says "NOTHING FAILS TODAY IF THESE TWO
# DISAGREE" and "moving one of these two lines means moving the other in the
# same commit". Nine changes were assigned between 2026-08-17 and 2026-08-18
# (2.10.0 → 2.18.0) and this literal moved for NONE of them: it read 2.9.0
# while 07-frontend/package.json read 2.18.0, and the comment directly above
# still narrated 2.7.4 — so BOTH the number and the prose describing it were
# stale, by nine changes and eleven respectively. Nothing went red, because the
# guard is still owed. That is the whole point: a step depending on someone
# remembering is the step that is not followed.
#
# Corrected to 2.18.0 to match package.json, the ONE source of truth (CR-004
# §7). This repair does not close the gap — only the gate does. Until
# 10-scripts/gates/ carries a check asserting these two literals are equal,
# this line will drift again, and the next drift will also be invisible.
#
# 2.18.1 — the FIRST <fix> this scheme has ever recorded (2026-08-18). Three
# defect fixes on the CR-007 template screens landed on top of an unchanged
# 2.18.0: DEF-211 (eight of B14's twenty rules), DEF-212 (four of five faults)
# and DEF-209's remainder, plus DEF-244 and DEF-245 found while fixing them.
# `<fix>` and not `<change>` because no CR moved — the change process's own
# reading: a fix counts defects landed ON TOP OF a shipped change. Both
# literals moved in this commit, which is STILL the only thing keeping them
# equal, one day after DEF-242 proved that is not enough.

# 2.19.0 — CR-011 item 9 (2026-08-18): the four contract classes stop being
# empty. A <change> and not a <fix>, because a CR landed code: the PO reversed a
# standing refusal ("already answer - provide default and allow user to change")
# and the count of classes with no wording went 4 -> 0. The authoring lane
# declined to take this bump itself and was right to — the source of truth lives
# in 07-frontend/, another lane was working in that directory, and a pathspec
# commit takes the WHOLE file (DEF-165). Taken here once that tree was clean,
# with both literals moving in the same commit, which is still the only thing
