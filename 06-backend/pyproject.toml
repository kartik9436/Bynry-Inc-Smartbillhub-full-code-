# <fix> and not <change> because no CR landed code. Both literals moved in this
# commit, which is STILL the only thing keeping them equal (DEF-242).

#
# 2.29.0 — CR-018 Phase 0: the Tailwind build chain and theme (2026-08-19).
# `<release>.<change>.<fix>`: R2, CR-018, fix 0. CHANGE level rather than fix
# because it is the first build of a new CR — even though it renders nothing.
# That is the point of Phase 0: built twice at one commit in an isolated
# worktree with nothing changed but the plugin line, the production CSS is
# byte-identical — index-DSjCOfdd.css, 125.25 kB, sha256 6ab0e6ad…85f123ed —
# so the CR-016 build the PO is verifying in a browser cannot have moved. Both
# literals moved in this commit, which is still the only thing keeping them
# equal (DEF-242).
#
# 2.29.1 — CR-018 Phase 1.5, DEF-335: the two sentences the PO photographed on
# Settings → Templates are rewritten as customer English, and G28 stopped being
# an allowlist. `<release>.<change>.<fix>`: R2, CR-018, fix 1. FIX level because
# no new capability lands — a served string changed and a gate widened — but the
# bump is not optional: this is the build that must be named when the PO looks
# at that screen again, which is the whole reason step 7 exists. The gate now
# sweeps every string 25 API modules serialise and finds 29 where the allowlist
# found 0; two are fixed, 27 are baselined. Both literals moved in this commit,
# which is still the only thing keeping them equal (DEF-242).
#
# 2.29.3 — CR-018 Phase 1.5, DEF-336: SET-04's card badge has three states
# instead of two (2026-08-19). `<release>.<change>.<fix>`: R2, CR-018, fix 3.
# FIX level: no new capability, a screen stopped drawing a blank. The BILLING
# section showed a bare chevron on all three cards while READS showed 5 and
