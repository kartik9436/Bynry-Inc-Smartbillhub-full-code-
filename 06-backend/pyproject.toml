#
# ⚠ **2.29.2 IS DELIBERATELY SKIPPED, AND THIS IS THE NOTE THAT SAYS SO.** The
# CR-018 Phase 1 lane holds 2.29.2 in the shared working tree for the Tailwind
# migration of Rate schedules; it had not committed when this landed. Taking it
# too would put two different builds behind one number, which is precisely what
# step 7 exists to prevent — a skipped number costs nothing, a duplicated one
# costs the ability to say which build a defect was seen on. Both literals
# moved in this commit, which is still the only thing keeping them equal
# (DEF-242).
#
# 2.29.4 — CR-018 Phase 1: the Tailwind utilities enter the app, on ONE screen.
# `<release>.<change>.<fix>`: R2, CR-018, increment 4. `src/styles/tailwind.css`
# is imported from `main.tsx` for the first time, so this is the first build a
# customer downloads Tailwind in at all: +7,324 raw / +1,670 gzip on the CSS
# bundle, of which 6,388 raw is a ONE-TIME floor and 936 is the migrated screen.
# Measured at one commit in an isolated worktree, because a bundle hash is a
# fact about the whole tree and six lanes are committing.
#
# Preflight is deliberately NOT part of it. Importing it moved 684 computed
# property values on one screen and dropped every <h1> in the product from 30px
# to 15px — `global.css:21` gives headings no font-size and the browser has
# always supplied it. It lands at the end of Phase 3, blocked on OQ-275.
#
# Rate schedules (`/plans-rates/rates`) is the migrated screen and it renders
# BYTE-IDENTICALLY: 0 differing computed values across 237 elements and an
# identical full-page PNG. CR-016's conformance register holds every number.
#
# ⚠ **THIS LANE WAS RESERVED 2.29.2 AND TOOK 2.29.4 INSTEAD, WHICH IS THE NOTE
# ABOVE WORKING.** The DEF-336 lane skipped 2.29.2 because this lane was holding
# it uncommitted, and shipped 2.29.3. By the time Phase 1 committed, 2.29.3 was
# on the branch — so taking 2.29.2 would move the PRODUCT VERSION BACKWARDS, and
# a defect reported against "2.29.2" could then mean either of two builds, which
# is the exact ambiguity step 7 exists to remove. Two skipped numbers cost
# nothing. **And this was caught only by rebuilding both files from the remote
# tip rather than from the copy this lane had read 40 minutes earlier** — the
# stale-base half of hard-won law 11, which would otherwise have reverted the
# whole 2.29.3 block in a commit whose file count was correct.
#
# Both literals moved in this commit, which is still the only thing keeping them
# equal (DEF-242).
#
# ⚠ **2.29.7 IS SKIPPED HERE AND THIS LITERAL WAS FOUND TWO CHANGES BEHIND —
# DEF-242's SHAPE, THIRD OCCURRENCE (recorded 2026-08-20, not filed).** At tip
# `e1a652c` `07-frontend/package.json` read **2.29.7** and this file read
# **2.29.6**: commit `8ea7847` (CR-018 Phase 2c step 1) moved the frontend
# literal and not this one. That lane is mid-change and may yet move it, so the
# OQ-277 lane recorded the drift rather than filing a defect against work that
# has not finished — but it could not leave the literals unequal either, because
# the sentence directly above is the only thing keeping them so.
#
# The resolution is the same one the 2.29.2 note reasoned out: a skipped number
# costs nothing, a duplicated one costs the ability to say which build a defect
# was seen on. So this goes 2.29.6 -> **2.29.8** rather than to 2.29.7, which is
# forward for BOTH files and cannot move the product version backwards.
#
# 2.29.8 — OQ-277 CLOSED: one source for the className grammar. The regex that
# reads class names out of a `.tsx` file existed twice, in two languages, in two
# workflows that share no runtime, and all three corrections it has ever had
# landed in one language only. `<release>.<change>.<fix>`: R2, CR-018, fix 8.
# No user-visible behaviour: G31 reports the same 908 declared / 863 referenced
# / 0 undeclared before and after.
# 2.76.4 — DEF-1108 (high): the approver on a deferred import load is decided
# at the DOOR and no longer re-asked in the worker, where `_JobActor` carries
# no role by design. A <fix> and not a <change> because no CR moved — CR-026
