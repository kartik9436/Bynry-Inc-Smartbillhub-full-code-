version = "2.614.0"
description = "Multi-tenant meter-to-cash + finance platform for small utilities"
requires-python = ">=3.12"
dependencies = [
  "django>=5.0,<6",
  "djangorestframework>=3.15",
  "drf-spectacular>=0.27",
  "psycopg[binary]>=3.1",
  "celery[redis]>=5.4",
  "django-environ>=0.11",
  # CR-068 wave A (2026-09-03): the portal address as a QR code a utility prints
  # on its bills (US-CWP-069 TC-1). Pure Python, no dependency of its own, BSD.
  "segno>=1.6,<2",
  # CR-168-BRC10 §F, DEF-WRK-9641 (2026-10-04): a field photograph over 100 KB is
  # SHRUNK by the server, never refused (PO: "you cannot reject the photo - that
  # will drop the data"), and a file that is not an image is told apart from one
  # that is. The backend had no image library; Pillow is the standard one (HPND).
  # A RUNTIME dependency — the Dockerfile installs exactly this list.
  "pillow>=11,<12",
  # CR-172-BRC10 (2026-10-05): BR-TEN-019's "SVG … rasterized for PDF/print" —
  # an SVG logo is rendered to PNG ONCE, at upload (apps/tenancy/logo.py
  # `raster_png`), and bills draw that PNG. Nothing in the backend could render
  # an SVG before. resvg-py is a self-contained wheel (the resvg renderer in
  # Rust): no system library, no network fetch, no script engine. MIT.
  # A RUNTIME dependency — the Dockerfile installs exactly this list.
  "resvg-py>=0.5,<1",
  # CR-169-BRC10 (2026-10-04): server-side product analytics, sent after commit
  # (`config/product_analytics.py`). Off unless POSTHOG_KEY is set. MIT.
  "posthog>=7,<8",
  # CR-190-BRC10 (2026-10-22): money in every email is written with its currency
  # SYMBOL in the utility's region — PO: *"the symbol comes from the utility's
  # currency and region settings … Nothing is hardcoded"*. Babel carries the
  # Unicode CLDR locale data (symbols, placement, marks), so no table of symbols
  # is typed in this repo (`apps/notifications/rendering.format_money`). Pure
  # Python, BSD. A RUNTIME dependency — the Dockerfile installs exactly this list.
  "babel>=2.14,<3",
  # WSGI server. Closes the 09-infra/02 §10.1 residue: config/wsgi.py has existed
  # since 2026-08-10 but nothing declared a server to import it, so `pip install -e .`
  # produced an application with nothing to run it. `manage.py runserver` is a dev
  # tool and is never the answer here. Declared as a real dependency (not an extra)
  # because a serving container is the normal shape of this project, not an option:
  # 06-backend/Dockerfile installs exactly this list and runs
  # `gunicorn config.wsgi:application`.
  "gunicorn>=23.0,<27",
  # App-layer field encryption (BR-CUS-092 / OQ-016 CLOSED, B2 §6). AES-256-GCM
  # and HKDF for core/crypto.py — a VETTED library, never hand-rolled crypto.
  #
  # ⚠ IT WAS ALREADY IMPORTABLE IN THE DEV CONTAINER AND THAT PROVED NOTHING
  # (hard-won law 1). `pip show cryptography` reported 41.0.7 with an EMPTY
  # `Required-by`: a distro package nothing here declared. The Dockerfile builds
  # its requirements from THIS LIST ONLY (`tomllib.load(...)['project']
  # ['dependencies']`), so `from cryptography...` would have raised
  # ModuleNotFoundError in the shipped image while every local test passed.
  # >=42 because the 41.x line still needs a separate `_cffi_backend`, which the
  # distro build in this environment was missing outright — importing it panicked
  # the Rust bindings until `cffi` was installed by hand.
  "cryptography>=42,<47",
  # CR-049 — the document store's AWS S3 adapter (apps/tenancy/document_storage.py).
  #
  # A RUNTIME dependency, not a dev one, and that is the whole reason this
  # comment exists: the `cryptography` note above records what happens
  # otherwise — a library importable in the dev container, undeclared here,
  # every local test green, and `ModuleNotFoundError` in the shipped image,
  # because 06-backend/Dockerfile builds its requirements from THIS LIST ONLY.
  #
  # PO ruling 2026-08-30: *"curently we will start with AWS, but we need to
  # keep it multi cloud - google or any other cloud - in future we mght have
  # differnt requirements"*. So exactly ONE cloud client is declared. A GCS or
  # Azure adapter brings its own, and neither exists.
  #
  # ⚠ IT IS NOT INSTALLED IN THE ENVIRONMENT THIS LANE AUTHORED IN, so the AWS
  # adapter is proved against an injected client rather than a real bucket —
  # the request is verified, a real round trip is not. Reported, not hidden.
  # The filesystem backend needs nothing at all, which is what keeps the suite
  # honest without a cloud account.
  "boto3>=1.34,<2",
  # CR-144-BRC07 (X1) — CORS. The SPA is served from a DIFFERENT HOST to this
  # API (decision log 2026-09-28 ruling 1: two hosts, because the PO refused
  # CDN path-routing of `/api/*` and the lock-in that comes with it), so every
  # call the browser makes is cross-origin and needs an explicit grant.
  #
  # A RUNTIME dependency, and the `cryptography` note above records exactly why
  # that matters: 06-backend/Dockerfile builds its requirements from THIS LIST
  # ONLY, so a library importable in the dev container and undeclared here is
  # green on every local test and `ModuleNotFoundError` in the shipped image —
  # and here it would be raised at settings import, so the container would not
  # start at all.
  "django-cors-headers>=4.4,<5",
  # CR-173-BRC10 (2026-10-07): the New World / Logos receipt file is PLACED in
  # a city's SFTP folder (PO: *"this path is specific for 1 tenant/utility and
  # not common for everyone"*). paramiko is the one SFTP client, adapted to
  # `FolderWriter` in apps/integrations/sftp.py and bound there once; it does
  # nothing for a utility that has not typed a server on its connection. LGPL.
  # A RUNTIME dependency — the Dockerfile installs exactly this list.
  "paramiko>=3.4,<5",
  # DEF-BIL-10546 (portal accessibility F-06, PO/QA ruling 2026-10-23, Group
  # H): every customer PDF is written as tagged PDF/UA-1 by WeasyPrint from the
  # document's HTML (`core/tagged_pdf.py`). PINNED EXACTLY: the bytes of every
  # bill issued are kept write-once for seven years, and a WeasyPrint upgrade
  # changes those bytes, so moving this pin is a deliberate act with its own
  # veraPDF run (`10-scripts/a11y/verapdf_customer_pdfs.py`). 70.0 was released
  # 2026-09-08 and supports `pdf_variant="pdf/ua-1"`. BSD-3-Clause. It brings
  # pydyf, tinyhtml5, tinycss2, cssselect2, Pyphen and fontTools (all BSD/MIT)
  # and needs Pango + HarfBuzz as SYSTEM libraries — the Dockerfile installs
  # them, and a running host gets them only when its image is rebuilt.
  "weasyprint==70.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-django>=4.8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "black>=24",
  "mypy>=1.10",
  "factory-boy>=3.3",
  # An in-process S3 EMULATOR for the export store's tests (PO 2026-10-02:
  # exports live in S3 in every environment, no filesystem stand-in). The suite
  # drives the real boto3 client against it; no test needs AWS credentials.
  # tests/conftest.py `_export_store_on_s3_emulator`.
  "moto[s3]>=5,<6",
]

# Package discovery. Without this, setuptools' flat-layout auto-discovery sees
# four top-level directories (apps, config, core, tests), calls the project
# ambiguous and REFUSES — so `pip install -e ".[dev]"` failed outright, which is
# the command .github/workflows/ci-backend.yml runs and the command
# 09-infra/02 §10.1 assumed produced a serving install. The old dev Dockerfile
# worked around it with `|| pip install <the same pins again>`, i.e. a second
# dependency list that could drift from this one. Naming the three real packages
# fixes the cause; tests/ is correctly not one of them.
[tool.setuptools.packages.find]
include = ["apps*", "config*", "core*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests", "apps"]
markers = [
  "golden: B5 golden billing tests (release gate)",
  "isolation: tenant-isolation suite (release gate)",
]

[tool.ruff]
line-length = 100

# DEF-025: the lint bar is now a REPO decision, not a property of the installed
# ruff. Until this line existed `[tool.ruff]` set only `line-length`, so the
# project inherited ruff's DEFAULT select — and "the narrow bar E4,E7,E9,F" was a
# convention nobody had written down. A future ruff release moving its default
# would have moved this project's bar with no diff to review.
#
# The value below is NOT a new bar: it is the bar that was already running,
# pinned. Verified mechanically against ruff 0.15.8 — `ruff check --show-settings`
# enumerated exactly 59 enabled rules before this change (E401/E402, E7xx, E902,
# F4xx–F9xx) and the SAME 59 after, diffed rule-by-rule: nothing widened and,
# more importantly, nothing narrowed. `ruff check .` is clean on both sides.
# Re-verify after a ruff upgrade the same way, against an unpinned replica config.
#
# Note what is deliberately NOT here: E501 (line-too-long) is in E5, is not in
# ruff's default select and is not added now — `line-length = 100` above feeds
# the formatter and `[tool.black]`, and black owns line length in this repo
# (enforced in CI since DEF-024). Widening this list is a reviewable diff, which
# is the entire point.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# F811 in tests/ only: this repo shares pytest fixtures by importing them from
# helper modules (tests/test_us_rat_helpers.py, tests/isolation_helpers.py,
# tests/test_us_idn_helpers.py) so pytest can resolve them by name; the test then
# names the same fixture as a function PARAMETER. Ruff reads that parameter as a
# redefinition of the import and raises F811 — 191 times as of ruff 0.15.8. The
# imports already carry `# noqa: F401 (fixture import)`; the noqa cannot cover the
# parameter, which is on a different line.
#
# This is a tool disagreement, not drift: every one of the 191 sites was checked
# mechanically and all 191 resolve to a function parameter, and an AST scan for
# duplicate module-/class-level function definitions across tests/ and apps/
# returned zero — so nothing real is being masked here today. Ruff's own fix for
# F811 (--unsafe-fixes) would DELETE the fixture imports and break collection.
#
# Deliberately scoped to one rule in one directory: F811 stays live for apps/,
# config/ and core/, where a redefinition is a genuine bug. The real remedy is to
# move the shared fixtures into tests/conftest.py so the imports are unnecessary
# at all — that is a fixture-resolution refactor across 21 files, not a lint fix,
# and it is not done here.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F811"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.12"
# B8: hints mandatory; --strict applies to services.py and engine modules.
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["apps", "core"]

[tool.coverage.report]
# B8/G10: services coverage floor is 85% once story code exists; enforced per-story
# by the gate, not as a repo-wide fail_under while scaffolding dominates.
show_missing = true
