# 2.125.4 — DEF-3156: a capacity companion (solar, broadband, battery) had no
# rate-schedule payload in `apps/rating/sample_data`, so a utility selling one
# of them received the whole sample estate and then 0 accounts and 0 bills.
# A <fix> and not a <change> because no CR moved. ⚠ THIS LITERAL READ 2.125.2
# while `07-frontend/package.json` — the ONE source of truth (CR-004 §7) — read
# 2.125.3, so it is corrected to match in the same commit that moves the other,
