# 2.19.1 — THE SECOND <fix> THIS SCHEME HAS RECORDED (2026-08-19), and it exists
# to stamp two fixes that shipped without one. DEF-264 (86f748a — every refusal
# on the S8 Notifications tab rendered the same nine words and threw the
# server's own sentence away) and DEF-265 (9dd7862 — SET-12D refused a test on
