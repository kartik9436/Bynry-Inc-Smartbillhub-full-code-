<title>Bulk Bill Run Redesign</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: product app frame — page head, 4-step rail, main column + sticky summary. SMARTBillHub tokens (07-frontend tokens.css): light-only, square corners, 4px spacing scale. */
:root{
  --bg:#f3f2f2; --surface:#ffffff; --panel:#eae9e9; --text:#201e1d; --muted:#605d5d; --faint:#9b9797;
  --line:#d7d3d3; --accent:#ec3013; --accent-ink:#ae1800; --accent-soft:#fff2ef;
  --ok:#0f6e3a; --ok-soft:#e6f4ec; --warn:#a65d0a; --warn-soft:#fdf0d8; --bad:#a81600; --bad-soft:#fde4df; --info:#1d4ea8; --info-soft:#e6eefb;
  --s-electric:#ec3013; --s-water:#1e6b8f; --s-gas:#c47a1d; --s-sewer:#5a5555; --s-trash:#3a6b3d; --s-fire:#8f1f14;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --t-xs:11px; --t-sm:12px; --t-base:13px; --t-md:14px; --t-body:15px; --t-h4:20px; --t-h2:32px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--t-body);line-height:1.55;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-weight:800;letter-spacing:-.015em;line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:var(--t-h2)} h2{font-size:var(--t-h4)} h3{font-size:var(--t-md);font-weight:700}
.kicker{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* demo strip */
.demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border:1px dashed var(--faint);font-size:var(--t-sm);color:var(--muted)}
.demo b{color:var(--text)}
.chipbtn{border:1px solid var(--line);background:var(--surface);padding:4px 10px;cursor:pointer;font-size:var(--t-sm)}
.chipbtn[aria-pressed="true"]{border-color:var(--text);font-weight:600}

/* page head */
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.crumb{font-size:var(--t-sm);color:var(--muted)}

/* kind cards */
.kinds{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.kind{background:var(--surface);border:1px solid var(--line);padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.kind strong{font-size:var(--t-md)}
.kind span{font-size:var(--t-sm);color:var(--muted)}
.kind[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
@media (max-width:900px){.kinds{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.kinds{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* rail */
.rail{display:flex;gap:0;border:1px solid var(--line);background:var(--surface)}
.rail button{flex:1;display:flex;align-items:center;gap:10px;padding:12px 16px;border:0;background:transparent;cursor:pointer;text-align:left;border-right:1px solid var(--line);min-width:0}
.rail button:last-child{border-right:0}
.rail .n{width:24px;height:24px;display:grid;place-items:center;border:1.5px solid var(--faint);font-size:var(--t-sm);font-weight:700;flex:none}
.rail button[data-state="current"]{box-shadow:inset 0 -3px 0 var(--accent)}
.rail button[data-state="current"] .n{background:var(--accent);border-color:var(--accent);color:#fff}
.rail button[data-state="done"] .n{background:var(--text);border-color:var(--text);color:#fff}
.rail button[disabled]{cursor:default;color:var(--faint)}
.rail .lbl{font-size:var(--t-md);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.rail .lbl{display:none}.rail button{justify-content:center}}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:960px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}

/* forms */
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:720px){.fields,.fields.two{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:var(--t-base);font-weight:600}
.f .req{color:var(--accent)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);padding:8px 10px;min-height:38px;width:100%;font-size:var(--t-md)}
.f input[readonly]{background:var(--bg);color:var(--muted)}
.f .help{font-size:var(--t-sm);color:var(--muted)}
.f.err input,.f.err select{border-color:var(--bad);background:var(--bad-soft)}
.f .msg{font-size:var(--t-sm);color:var(--bad);font-weight:600;display:none}
.f.err .msg{display:block}
.span2{grid-column:span 2} .span3{grid-column:1/-1}
@media (max-width:720px){.span2{grid-column:auto}}

/* account card */
.acct{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;border:1px solid var(--line);background:var(--bg);padding:12px 16px}
.acct div{display:flex;flex-direction:column;min-width:0}
.acct dt{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.acct dd{margin:0;font-size:var(--t-md);font-weight:600;overflow-wrap:anywhere}
@media (max-width:720px){.acct{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:var(--t-base)}
th{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;background:var(--bg);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td input{border:1px solid var(--line);padding:6px 8px;width:120px;font-size:var(--t-md)}
td input.err{border-color:var(--bad);background:var(--bad-soft)}
tr.muted td{color:var(--faint)}
.svc{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.dot{width:10px;height:10px;flex:none}
.tot td{font-weight:700;background:var(--bg)}

/* pills */
.pill{display:inline-block;font-size:var(--t-xs);font-weight:700;padding:2px 8px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-off{background:var(--panel);color:var(--muted)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)}

/* notes */
.note{display:flex;gap:10px;padding:10px 12px;font-size:var(--t-base);align-items:flex-start}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.bad{background:var(--bad-soft);color:var(--bad)} .note.ok{background:var(--ok-soft);color:var(--ok)} .note.info{background:var(--info-soft);color:var(--info)}
.note b{color:inherit}
.note ul{margin:4px 0 0;padding-left:18px}

/* buttons */
.btn{border:1px solid var(--text);background:var(--surface);padding:0 18px;min-height:40px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px}
.btn.link{border:0;background:none;color:var(--accent-ink);padding:0;min-height:0;text-decoration:underline}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.actions .right{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* summary */
.sum{display:flex;flex-direction:column;gap:6px;font-size:var(--t-base)}
.sum .row{display:flex;justify-content:space-between;gap:12px}
.sum .row span:first-child{color:var(--muted)}
.big{font-size:26px;font-weight:800;line-height:1.1}
.hr{border-top:1px solid var(--line)}

/* bill preview */
.bill{border:1px solid var(--line);background:var(--surface)}
.bill-h{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:16px 20px;border-bottom:3px solid var(--text)}
.bill-h .meta{display:grid;grid-template-columns:auto auto;gap:2px 16px;font-size:var(--t-base)}
.bill-h .meta span:nth-child(odd){color:var(--muted)}
.sendcard{border-top:3px solid var(--text)}
.sendtop{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.sendamt{text-align:right}
.muted-s{font-size:var(--t-base);color:var(--muted)}
.ack{display:flex;gap:10px;align-items:center;font-weight:600;font-size:var(--t-md)}
.ack input{width:18px;height:18px;accent-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.done{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.done .check{width:44px;height:44px;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800}
.row-add{align-self:flex-start}
.periods{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (prefers-reduced-motion:no-preference){.panel,.bill{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}

details.panel>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary .sumr{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
details.panel>summary .chev{width:28px;height:28px;border:1px solid var(--line);display:grid;place-items:center;font-size:14px;transition:transform .15s}
details.panel[open]>summary .chev{transform:rotate(180deg)}
details.panel:not([open]){gap:0}
.combo{position:relative}
.combo .cin{display:flex;align-items:center;border:1px solid var(--line);background:var(--surface)}
.combo .cin input{border:0;flex:1;min-width:0}
.combo .cin .caret{padding:0 12px;color:var(--muted);font-size:14px;pointer-events:none}
.combo ul{position:absolute;top:calc(100% + 2px);left:0;right:0;z-index:5;background:var(--surface);border:1px solid var(--text);box-shadow:0 12px 32px rgba(45,43,43,.22);max-height:280px;overflow:auto;margin:0;padding:0;list-style:none}
.combo li{padding:8px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.combo li:last-child{border-bottom:0}
.combo li .nm{font-weight:600;font-size:var(--t-md)}
.combo li .sub{grid-column:1/-1;font-size:var(--t-sm);color:var(--muted)}
.combo li[aria-selected="true"]{background:var(--accent-soft)}
.combo li mark{background:none;color:var(--accent-ink);font-weight:700}
.combo .empty{padding:10px 12px;color:var(--muted);font-size:var(--t-base)}
.billt tr.grp td{background:var(--panel);font-weight:700;font-size:var(--t-sm);text-transform:uppercase;letter-spacing:.06em;padding:6px 12px}
.billt tr.foot td{color:var(--muted)}
.billt td:nth-child(3){white-space:nowrap}
.period-block{display:flex;flex-direction:column;gap:8px}
.period-block h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left;font-weight:600}
.yes{color:var(--ok);font-weight:700}.no{color:var(--faint)}
.cmp-kind{display:flex;flex-direction:column;gap:12px;border-top:3px solid var(--text);padding-top:16px}
.cmp-kind>.kh{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.grid.one{grid-template-columns:minmax(0,1fr)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.facts.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:720px){.facts,.facts.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fact{border:1px solid var(--line);background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.fact span{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fact b{font-size:var(--t-md)}
.f.span2,.fact.span2{grid-column:span 2}
@media (max-width:720px){.f.span2{grid-column:auto}}
.facts.cyc{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:720px){.facts.cyc{grid-template-columns:repeat(2,minmax(0,1fr))}}
details.panel[open]>:not(summary)+*{margin-top:16px}
.svcs{display:flex;flex-wrap:wrap;gap:6px}
.svc{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);padding:3px 8px;font-size:var(--t-xs);font-weight:600;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.svc i{width:8px;height:8px;flex:none;display:inline-block}
.sum-h{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.msgs{display:flex;flex-direction:column;gap:8px}
.msgs .note ul{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:4px}
.msgs .note li a{color:inherit;font-weight:700}
.f .wmsg{display:block;color:var(--warn);font-size:var(--t-sm);margin-top:4px}
.f.wn input,.f.wn select{border-color:var(--warn)}
.why{font-size:var(--t-sm);color:var(--bad);font-weight:600}
[hidden]{display:none!important}
.two-t{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:720px){.two-t{grid-template-columns:minmax(0,1fr)}}
tr.sub td{font-weight:700;background:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--surface);padding:10px 16px;z-index:60;max-width:min(560px,calc(100% - 32px));font-size:var(--t-sm)}
.dot.ok{background:var(--ok)}
.ready-tab{padding:10px 12px;background:var(--ok-soft)}
.ready-tab[aria-pressed="true"] .dot.ok{background:var(--surface)}
tr.row-off td{opacity:.55}
.tiles.five b{font-size:var(--t-md)}
.acct-t th:first-child,.acct-t td:first-child{width:36px;padding-right:0}
.acct-t input[type=checkbox]{width:auto;padding:0}
.acct-t .num{white-space:nowrap}
.acct-t td:last-child{min-width:230px}
.dec{display:flex;flex-direction:column;gap:6px}
.tiles.five{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:720px){.tiles.five{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile.info b{color:var(--info)}
.p-info{background:var(--info-soft);color:var(--info)}
.ck{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.ck{grid-template-columns:minmax(0,1fr)}}
.cats{border:1px solid var(--line);background:var(--surface);max-height:640px;overflow:auto}
.cats-top{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.cats-top input[type=search]{border:1px solid var(--line);padding:6px 8px;background:var(--surface)}
.cat-h{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer;text-align:left}
.tag{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px 7px 16px;border:0;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font-size:var(--t-sm)}
.tag:hover{background:var(--bg)}
.tag[aria-pressed="true"]{background:var(--text);color:var(--surface)}
.tag.zero{color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;margin-right:8px;vertical-align:middle}
.dot.B{background:var(--bad)} .dot.D{background:var(--warn)} .dot.W{background:var(--info)}
.tagpane{display:flex;flex-direction:column;gap:12px;min-width:0}
.tag-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.tag-h h3{margin:2px 0;font-size:var(--t-md);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bulk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--bg);border:1px solid var(--line)}
.in-sm{border:1px solid var(--line);background:var(--surface);padding:4px 8px;min-height:30px;font-size:var(--t-sm);max-width:160px}
.ifix{display:inline-flex;gap:6px;align-items:center;flex-wrap:nowrap}
.ifix .in-sm{width:96px}
.acct-t td{vertical-align:top}
.row-ok td{background:var(--ok-soft)}
.linkish{border:0;background:none;padding:0;cursor:pointer;color:var(--accent-ink);text-decoration:underline}
.mini{border:1px solid var(--line);background:var(--surface);font-size:var(--t-xs);padding:1px 6px;cursor:pointer;margin:1px 0}
.mini.B{border-color:var(--bad);color:var(--bad)} .mini.D{border-color:var(--warn);color:var(--warn)} .mini.W{border-color:var(--info);color:var(--info)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:rgba(20,16,14,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:50;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 20px;display:flex;flex-direction:column;gap:14px}
.drawer h2{margin:2px 0}
.drawer.wide{width:min(720px,100%)}
.drawer .btn{white-space:nowrap}
.dprobs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.dprobs li{border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.dp-h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.fact small{font-size:var(--t-xs);color:var(--muted)}
</style><style>
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}

.tile span{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tile b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.tile[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--accent);border-color:var(--text)}
.tile.ok b{color:var(--ok)} .tile.warn b{color:var(--warn)} .tile.bad b{color:var(--bad)}
.bar{height:10px;background:var(--panel);position:relative;overflow:hidden}

.checks{display:flex;flex-direction:column;gap:10px}

     <tr><td>Payment plan instalments</td><td class="r num">48</td><td class="r num">${money(2160.00)}</td></tr>
     <tr><td>Level pay</td><td class="r num">64</td><td class="r num">${money(7040.00)}</td></tr>
     <tr><td>Credit covers the bill</td><td class="r num">22</td><td class="r num">${money(0)}</td></tr>
     <tr><td>Pay by due date</td><td class="r num">849</td><td class="r num">${money(149239.11)}</td></tr>
    </tbody></table></div>
   </div>
  </details>
  <details class="panel" data-coll="types" ${S.open.types?"open":""}><summary><h2>By customer type</h2><span class="sumr"><span class="kicker">4 types</span><span class="chev" aria-hidden="true">▾</span></span></summary>
   <div class="tw"><table><thead><tr><th>Customer type</th><th class="r">Bills</th><th class="r">Charges</th></tr></thead><tbody>
    <tr><td>Residential</td><td class="r num">1,212</td><td class="r num">${money(148220.10)}</td></tr>
    <tr><td>Commercial</td><td class="r num">146</td><td class="r num">${money(61904.30)}</td></tr>
    <tr><td>Master accounts</td><td class="r num">12</td><td class="r num">${money(3862.12)}</td></tr>
    <tr><td>Government</td><td class="r num">1</td><td class="r num">${money(400.00)}</td></tr>
    <tr class="tot"><td>Total</td><td class="r num">1,371</td><td class="r num">${money(214386.52)}</td></tr></tbody></table></div>
  </details>
  ${leftOutPanel(false)}
  <div class="note warn"><div><b>4 warnings.</b><ul><li>14 bills: Electric base $0.00. <a class="fix" href="#" data-gotag="base_zero">See</a></li><li>3 bills: no services on file. <a class="fix" href="#" data-gotag="no_agree">See</a></li><li>4 autopay cards expire before Oct 22. <a class="fix" href="#" data-gotag="autopay_exp">See</a></li><li>2 bills failed to draft. <a class="fix" href="#" data-list="breaks">See breaks</a></li></ul></div></div>
  <section class="panel"><div class="panel-h"><h2>Sign off</h2></div>
   <div class="checks">${conf.map(c=>`<label><input type="checkbox" data-conf="${c[0]}" ${S.conf[c[0]]?"checked":""}> ${c[1]}</label>`).join("")}</div>
  </section>
  <div class="actions"><button class="btn" data-back>Back</button><div class="right"><button class="btn primary" id="next" ${all?"":"disabled"}>Sign off</button></div></div>`;
}

function step4(){
  if(S.sent) return `<section class="panel done"><div class="check" aria-hidden="true">✓</div><h2>1,369 bills sent</h2>
    <div class="sum" style="width:100%;max-width:460px"><div class="row"><span>Total</span><b class="num">${money(214104.20)}</b></div><div class="row"><span>Due</span><b class="num">Oct 22, 2026</b></div><div class="row"><span>Delivery</span><b>1,102 e-mail · 267 paper · queued</b></div><div class="row"><span>Meter reads</span><b>Locked</b></div></div>
    <div class="note bad" style="width:100%"><div><b>2 bills not sent.</b> AC-2026-00902: template can't render. AC-2026-01144: GL account missing for trash. <a class="fix" href="#" data-list="breaks">See breaks</a></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary">View run</button><button class="btn">Print paper bills</button></div></section>${leftOutPanel(true)}`;
  if(S.sending>0){return `<section class="panel"><div class="panel-h"><h2>Sending</h2><span class="kicker num">${n(Math.round(1371*S.sending))} of 1,371</span></div><div class="bar"><i style="width:${S.sending*100}%"></i></div><span class="muted-s">Each bill is sent on its own. One failure doesn't stop the rest.</span></section>`;}
  return `<section class="panel sendcard"><div class="sendtop"><div><div class="kicker">Run BR-0232 · Cycle 3</div><h2 style="margin-top:4px">Sep 1 – Sep 30, 2026</h2><div class="muted-s">Signed off by J. Ortiz · Oct 1, 09:42</div></div>
    <div class="sendamt"><div class="kicker">Total</div><div class="big num">${money(214386.52)}</div><div class="muted-s num">1,371 bills · due Oct 22</div></div></div>
    <div class="tw"><table><tbody><tr><td>Delivery</td><td class="r">1,104 e-mail · 267 paper</td></tr><tr><td>Autopay</td><td class="r num">388 accounts</td></tr><tr><td>Template</td><td class="r">Standard bill · v4</td></tr><tr><td>Warnings</td><td class="r"><span class="pill p-warn">3</span></td></tr></tbody></table></div>
    <div class="note bad"><div><b>Final once sent.</b> Changes need a credit note.</div></div>
    <label class="ack"><input type="checkbox" id="ack" ${S.ack?"checked":""}> I checked the totals</label>
    <div class="actions"><button class="btn" data-back>Back</button><div class="right"><button class="btn danger" id="send" ${S.ack?"":"disabled"}>Send 1,371 bills</button></div></div></section>`;
}

function summary(){
  const PS=S.step===0&&S.scope==="problems", WS=S.step===0&&S.scope==="warnings", D="—";
  const per=S.scope==="gap"?"Oct 10 – Nov 9 · 31 days":S.scope==="overlap"?"Sep 15 – Oct 14 · 30 days":WS?"Sep 1 – Oct 15 · 45 days":PS?D:"Sep 1 – Sep 30 · 30 days";
  const rows=[["Run name",PS?D:"September 2026 · Riverside"],["Cycle","Cycle 3 · Riverside"],["Period",per],["Bill date",PS?D:WS?"Oct 20, 2026":S.scope==="gap"?"Nov 10, 2026":S.scope==="overlap"?"Oct 15, 2026":"Oct 1, 2026"],["Days to pay",PS?D:WS?"30":"21"],["Due",PS?D:WS?"Nov 19, 2026":S.scope==="gap"?"Dec 1, 2026":S.scope==="overlap"?"Nov 5, 2026":"Oct 22, 2026"],["Template",PS?D:"Standard · v4"]];
  const SVCS=[["Electric","#ec3013"],["Water","#1e6b8f"],["Sewer","#5a5555"],["Trash","#3a6b3d"],["Storm water","#2f4a7a"]];
  const cont=S.scope==="gap"?'<span class="pill p-warn">Gap</span>':S.scope==="overlap"?'<span class="pill p-bad">Overlap</span>':'<span class="pill p-ok">Continuous</span>';
  const more=`<div class="hr"></div><div class="sum-h">Services</div><div class="svcs">${SVCS.map(v=>`<span class="svc" aria-label="${v[0]}"><i aria-hidden="true" style="background:${v[1]}"></i>${v[0]}</span>`).join("")}</div>
   <div class="hr"></div><div class="sum"><div class="row"><span>Units</span><span class="num">${n(C.units)}</span></div><div class="row"><span>Accounts</span><span class="num">${n(C.accounts)}</span></div><div class="row"><span>Regular · master</span><span class="num">${n(C.regular)} · ${C.masters}</span></div><div class="row"><span>Meters</span><span class="num">${n(C.meters)}</span></div><div class="row"><span>Routes</span><span class="num">14</span></div></div>
   <div class="hr"></div><div class="sum"><div class="row"><span>Last run</span><span>BR-0231 · Aug 1 – Aug 31</span></div><div class="row"><span>Last run total</span><span class="num">${money(209944.18)}</span></div><div class="row"><span>Follows on</span>${cont}</div></div>`;
  let extra="";
  if(S.step>=1) extra+=`<div class="hr"></div><div class="sum"><div class="row"><span>Ready</span><span class="pill p-ok">${n(R.ready)}</span></div><div class="row"><span>Need a decision</span><span class="pill p-warn">${R.decide}</span></div><div class="row"><span>Blocked</span><span class="pill p-bad">${R.blocked}</span></div></div>`;
  if(S.step>=2) extra+=`<div class="hr"></div><div class="big num">${money(214386.52)}</div><div class="muted-s">1,371 draft bills</div>`;
  $("#summary").innerHTML=`<div class="kicker">${S.step===0?"Run to start":"Run BR-0232"}</div><div class="sum">${rows.map(r=>`<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join("")}</div>${S.step===0?(()=>{const M=scopeMsgs();return `<div class="hr"></div><div class="sum"><div class="row"><span>To fix</span><span class="pill ${M.R.length?"p-bad":"p-ok"}">${M.R.length}</span></div><div class="row"><span>Warnings</span><span class="pill p-warn">${M.W.length}</span></div></div>`+more;})():""}${extra}`;
}
function render(){rail();document.querySelector(".grid").classList.toggle("one",S.step===1);$("#summary").hidden=S.step===1;$("#main").innerHTML=[step1,step2,step3,step4][S.step]()+listDrawer()+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:"");summary();}

let timer;
function animate(key,done){clearInterval(timer);S[key]=0.05;render();timer=setInterval(()=>{S[key]=Math.min(1,S[key]+0.12);render();if(S[key]>=1){clearInterval(timer);done();}},350);}

document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.coll)S.open[d.dataset.coll]=d.open;},true);
document.addEventListener("click",e=>{if(e.target.classList&&e.target.classList.contains("scrim")){S.drawer=null;S.list=null;render();return;}const fo=e.target.closest("[data-focus]");if(fo){e.preventDefault();const el=document.getElementById(fo.dataset.focus);if(el){el.scrollIntoView({block:"center"});el.focus();}return;}if(e.target.closest("summary a"))e.preventDefault();
  const t=e.target.closest("button,a");if(!t)return;
  S.toast="";
  if(t.dataset.list){e.preventDefault();S.list=t.dataset.list;render();return;}
  if(t.dataset.listdone){e.preventDefault();S.listDone[t.dataset.listdone]=true;if(t.dataset.ext)S.toast="Opens "+t.dataset.ext+" in a new tab.";render();return;}
  if(t.dataset.ext){e.preventDefault();S.toast="Opens "+t.dataset.ext+" in a new tab.";render();return;}
  if(t.dataset.see){e.preventDefault();const v=t.dataset.see;if(v.startsWith("list:")){S.list=v.slice(5);render();return;}S.loF=v;S.open.left=true;render();const el=document.querySelector('details[data-coll="left"]');if(el)el.scrollIntoView({block:"start"});return;}
  if(t.dataset.gotag&&t.tagName==="A"){e.preventDefault();S.step=1;S.tag=t.dataset.gotag;S.sev="all";S.page=0;S.sent=false;render();window.scrollTo(0,0);return;}
  if(t.tagName==="A"){e.preventDefault();return;}
  if(t.dataset.go!==undefined){if(!t.disabled){S.step=+t.dataset.go;render();}return;}
  if(t.dataset.scope){S.scope=t.dataset.scope;S.step=0;S.gapOk=false;document.querySelectorAll("[data-scope]").forEach(b=>b.setAttribute("aria-pressed",String(b===t)));render();return;}
  if(t.dataset.check){S.check=t.dataset.check;S.step=1;document.querySelectorAll("[data-check]").forEach(b=>b.setAttribute("aria-pressed",String(b===t)));if(S.check==="running")animate("prog",()=>{S.check="done";document.querySelectorAll("[data-check]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.check==="done")));render();});else render();return;}
  if(t.dataset.lof){S.loF=t.dataset.lof;render();return;}
  if(t.hasAttribute("data-catchup")&&!t.disabled){S.catchup=Object.values(S.loSel).filter(Boolean).length;S.loSel={};render();return;}
  if(t.hasAttribute("data-lonext")&&!t.disabled){S.loSel={};render();return;}
  if(t.hasAttribute("data-lorecheck")&&!t.disabled){S.step=1;render();return;}
  if(t.dataset.gotag){S.step=1;S.tag=t.dataset.gotag;S.sev="all";S.page=0;render();return;}
  if(t.dataset.readyout){S.leftOutReady[t.dataset.readyout]=true;render();return;}
  if(t.dataset.readyin){S.leftOutReady[t.dataset.readyin]=false;render();return;}
  if(t.dataset.rpage){S.rpage=Math.max(0,(S.rpage||0)+ +t.dataset.rpage);render();return;}
  if(t.dataset.sev==="ok"){S.sev="all";S.tag="__ready";render();return;}
  if(t.dataset.sev){S.sev=t.dataset.sev;if(S.tag==="__ready")S.tag="missing_read";const f=TAGS.find(x=>x[4]>0&&(S.sev==="all"||S.sev==="ok"||x[2]===S.sev));if(f&&!(S.sev==="all"||S.sev==="ok"||tagById(S.tag)[2]===S.sev)){S.tag=f[0];S.page=0;}render();return;}
  if(t.dataset.cat){S.catOpen[t.dataset.cat]=S.catOpen[t.dataset.cat]===false;render();return;}
  if(t.dataset.tag){S.tag=t.dataset.tag;S.page=0;S.drawer=null;render();return;}
  if(t.dataset.page){S.page=Math.max(0,(S.page||0)+ +t.dataset.page);render();return;}
  if(t.dataset.acct){S.drawer=t.dataset.acct;render();return;}
  if(t.hasAttribute("data-close")){S.drawer=null;S.list=null;render();return;}
  if(t.dataset.fix){S.fixed[t.dataset.fix]=true;render();return;}
  if(t.dataset.recheck){const id=t.dataset.recheck;const ks=Object.keys(S.sel).filter(k=>S.sel[k]&&k.startsWith(id+":"));(ks.length?ks:[0,1,2,3,4,5,6,7].map(i=>id+":"+i)).forEach(k=>S.fixed[k]=true);render();return;}
  if(t.dataset.recheckacct){S.fixed[t.dataset.recheckacct]=true;S.drawer=null;render();return;}
  if(t.hasAttribute("data-applysel")){const a=S.answers[S.tag]||tagById(S.tag)[8][0][0];Object.keys(S.sel).filter(k=>S.sel[k]&&k.startsWith(S.tag+":")).forEach(k=>S.rowAns[k]=a);render();return;}
  if(t.dataset.ans){const [k,v]=t.dataset.ans.split(":");S.answers[k]=v;render();return;}
  if(t.hasAttribute("data-back")){S.step=Math.max(0,S.step-1);render();return;}
  if(t.id==="retry"){S.check="running";animate("prog",()=>{S.check="done";render();});return;}
  if(t.id==="next"&&!t.disabled){
    if(S.step===0){S.step=1;S.check="running";animate("prog",()=>{S.check="done";render();});return;}
    if(S.step===1){S.pricing=true;animate("pp",()=>{S.pricing=false;S.step=2;render();});return;}
    S.step=Math.min(3,S.step+1);render();return;}
  if(t.id==="send"&&!t.disabled){animate("sending",()=>{S.sending=0;S.sent=true;render();});return;}
});
document.addEventListener("change",e=>{
  const x=e.target;
  if(x.id==="gapok"){S.gapOk=x.checked;render();}
  else if(x.dataset.conf){S.conf[x.dataset.conf]=x.checked;render();}
  else if(x.id==="ack"){S.ack=x.checked;render();}
  else if(x.dataset.losel){S.loSel[x.dataset.losel]=x.checked;render();}
  else if(x.hasAttribute("data-loall")){leftRows().filter(r=>(S.loF||"all")==="all"||r.grp===S.loF).slice(0,8).forEach(r=>S.loSel[r.no]=x.checked);render();}
  else if(x.id==="showpassed"){S.showPassed=x.checked;render();}
  else if(x.dataset.sel){S.sel[x.dataset.sel]=x.checked;render();}
  else if(x.dataset.selall){const id=x.dataset.selall;for(let i=0;i<8;i++)S.sel[id+":"+((S.page||0)*8+i)]=x.checked;render();}
  else if(x.dataset.rowans){S.rowAns[x.dataset.rowans]=x.value;}
});
document.addEventListener("input",e=>{if(e.target.id==="tagq"){S.tagq=e.target.value;render();const q=document.getElementById("tagq");q.focus();q.setSelectionRange(q.value.length,q.value.length);}});
render();
})();
</script>
