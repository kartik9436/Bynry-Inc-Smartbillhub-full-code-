function facts(d){

 return {
  part: base?"Cut down by days":(d.part||(d.type==="Recurring"?"Cut down by days":"Full amount")),
  charged: base?"Every bill":(d.charged||({"One-time":"Once, when added","Recurring":"Every bill","Penalty":"When the event happens","Deposit":"Once, at move-in"})[d.type]),
  locks:{part:base||d.type!=="Recurring",charged:base||d.type==="Deposit",auto:base,tax:d.type==="Deposit"||d.type==="Penalty"}};}
function priceCols(d){
 if(d.kind==="base")return {rowKey:sized(d)?"size":null,cols:[[d.cls==="All"?"Every class":d.cls,"amt"]]};
 if(d.type==="Penalty")return {rowKey:d.pricedBy==="class"?"cls":d.pricedBy==="size"?"size":null,cols:[["Percent","pct"],["Minimum","min"]]};
 if(d.kind==="other"&&d.amountWhen==="used")return null;
 return {rowKey:d.pricedBy==="class"?"cls":d.pricedBy==="size"?"size":null,cols:[["Amount","amt"]]};}
function cells(d){const pc=priceCols(d);if(!pc)return{un:0,zero:0,tot:0};let un=0,zero=0,tot=0;d.rows.forEach(r=>pc.cols.forEach(([,k])=>{tot++;const v=r[k];if(v===undefined||v==="")un++;else if(Number(v)===0)zero++}));return{un,zero,tot};}

 if(pc&&pc.rowKey&&d.rows.some(r=>!r[pc.rowKey]))h+=`<div class="note bad"><b>Choose a ${pc.rowKey==="size"?"size":"customer class"}</b>&nbsp;for every row.</div>`;

 if(c.zero)h+=`<div class="note warn"><b>${c.zero} at $0.00.</b>&nbsp;Bills show $0.00.</div>`;return h;}

  const keyCell=pc.rowKey?(edit?`<td><select data-key="${i}" aria-label="Row ${i+1}"><option value="">Choose</option>${keyOpts.filter(o=>o===r[pc.rowKey]||!used.includes(o)).map(o=>`<option ${o===r[pc.rowKey]?"selected":""}>${esc(o)}</option>`).join("")}</select></td>`:`<td><b>${esc(r[pc.rowKey])}</b></td>`):"";
  return `<tr><td class="ns">${i+1}</td>${lead.map(l=>`<td class="ro">${l[1]()}</td>`).join("")}${keyCell}${pc.cols.map(([lab,k])=>{const v=r[k];
   if(edit)return `<td class="r"><input class="num ${v!==undefined&&v!==""&&Number(v)===0?"zero":""}" data-ri="${i}" data-c="${k}" value="${v??""}" placeholder="${k==="pct"?"%":"Not priced"}" inputmode="decimal" aria-label="Row ${i+1} ${lab}"></td>`;
   return `<td class="r num">${v===undefined||v===""?'<span class="ns">Not priced</span>':k==="pct"?Number(v).toFixed(2)+"%":money(v)}</td>`}).join("")}${showMin?`<td class="r num ro">${MINS[r.size]?money(MINS[r.size]):"—"}</td>`:""}${edit&&pc.rowKey?`<td><button class="x" data-rmi="${i}" aria-label="Remove row ${i+1}">×</button></td>`:""}</tr>`}).join("");
 const free=keyOpts.filter(o=>!used.includes(o));
 const foot=edit&&pc.rowKey?`<div class="tfoot"><button class="btn sm" id="addRow" ${free.length&&!d.rows.some(r=>!r[pc.rowKey])?"":"disabled"}>+ Add row</button>${free.length?"":`<span class="crumb">Every ${pc.rowKey==="size"?"size":"class"} is used.</span>`}${showMin?'<span class="crumb" style="margin-left:auto">Minimum is set on the rate schedule.</span>':""}</div>`:"";
 return `<div class="tw"><table><thead>${head}</thead><tbody>${body||'<tr><td colspan="9" class="crumb">No rows yet.</td></tr>'}</tbody></table>${foot}</div>${d.type==="Deposit"?'<div class="note info">Held as a deposit, not revenue. Refunded at close.</div>':""}`;}

function pricedLabel(d){return d.kind==="base"?`${d.cls==="All"?"Every class":d.cls}${sized(d)?" · by "+d.asset.toLowerCase()+" size":""}`:d.kind==="other"&&d.amountWhen==="used"?"Entered when used":d.pricedBy==="class"?"By customer class":d.pricedBy==="size"?"By "+(d.asset||"meter").toLowerCase()+" size":"One amount"}

 else if(k==="plan")det+=dd("Priced by",pricedLabel(d))+(d.pricedBy==="size"?dd("Asset",d.asset||"Meter"):"");
 else det+=dd("Priced by",d.amountWhen==="used"?"Entered when used":"One amount")+dd("Amount",amountOf(d));

  if(o.desc!==d.desc)ch.push(["Bill line",o.desc,d.desc]);if(o.cls!==d.cls)ch.push(["Customer class",o.cls,d.cls]);
  [["tax","May be taxed"],["waive","Staff may waive"],["own","Own line on bill"]].forEach(([k,l])=>{if(o[k]!==d[k])ch.push([l,o[k]?"Yes":"No",d[k]?"Yes":"No"])})}
 return `<section class="panel"><div class="panel-h"><h2>Charge</h2></div><dl class="acct">
   <div><dt>Code</dt><dd>${d.code||"—"}</dd></div><div><dt>Bill line</dt><dd>${esc(d.desc)||"—"}</dd></div><div><dt>Kind</dt><dd>${KINDS[d.kind]}</dd></div><div><dt>Type</dt><dd>${d.type}</dd></div>
   <div><dt>Service</dt><dd>${s.name}</dd></div><div><dt>Priced by</dt><dd>${pricedLabel(d)}</dd></div><div><dt>Part month</dt><dd>${f.part}</dd></div><div><dt>Charged</dt><dd>${f.charged}</dd></div>
   <div><dt>May be taxed</dt><dd>${d.tax?"Yes":"No"}</dd></div><div><dt>Apply automatically</dt><dd>${d.auto||d.kind==="base"?"Yes":"No"}</dd></div><div><dt>Staff may waive</dt><dd>${d.waive?"Yes":"No"}</dd></div><div><dt>Own line on bill</dt><dd>${d.own?"Yes":"No"}</dd></div></dl></section>
 <section class="panel"><div class="panel-h"><h2>Prices</h2></div>${table(d,false)}${warnNotes(d)}</section>
 ${add?"":`<section class="panel"><div class="panel-h"><h2>What changes</h2><span class="kicker">${ch.length} changes</span></div><div class="tw"><table><thead><tr><th>Item</th><th>Now</th><th>New</th></tr></thead><tbody>${ch.length?ch.map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num chg">${r[2]}</td></tr>`).join(""):'<tr><td colspan="3" class="crumb">Nothing changed yet.</td></tr>'}</tbody></table></div></section>`}
 <section class="panel"><div class="panel-h"><h2>${add?"When":"When and why"}</h2></div><div class="fields">
  <div class="f"><label for="from">Effective from <span class="req">*</span></label><input id="from" type="date" value="${S.from}">${S.fromErr?'<span class="msg">Pick a date.</span>':'<span class="help">Bills dated on or after.</span>'}</div>
  <div class="f"><label for="to">Effective to</label><input id="to" type="date" value="${S.to}" min="${S.from}"><span class="help">Blank means no end.</span></div><div></div>
  ${add?"":`<div class="f span3"><label for="why">Reason <span class="req">*</span></label><textarea id="why" rows="2" placeholder="Board approved, Oct 2026">${esc(S.why)}</textarea>${S.whyErr?'<span class="msg">Add a reason.</span>':""}</div>`}</div>
  ${add?"":'<div class="note info">Sent bills keep their price. Open bill runs re-check.</div>'}</section>
 ${S.saved?`<div class="note ok"><b>${d.code} ${add?"created":"saved"}.</b>&nbsp;Effective ${fd(S.from)}${S.to?" to "+fd(S.to):""}.</div>`:""}
 <div class="actions"><button class="btn" data-back>Back</button><div class="right"><button class="btn">Save draft</button><button class="btn primary" data-save>${add?"Create charge code":"Save change"}</button></div></div>`;}
function act(back,block){return `<div class="actions">${back?'<button class="btn" data-back>Back</button>':"<span></span>"}<div class="right"><button class="btn primary" data-next ${block?"disabled":""}>Continue</button></div></div>`;}
function summary(){const d=D(),c=cells(d);
 return `<div class="kicker">${S.scr==="add"?"New charge code":"Editing"}</div><div class="big">${d.code||"—"}</div>
  <div class="sum"><div class="row"><span>Bill line</span><span>${esc(d.desc)||"—"}</span></div><div class="row"><span>Kind</span><span>${KINDS[d.kind]}</span></div><div class="row"><span>Service</span><span>${SVC[d.svc].name}</span></div><div class="row"><span>GL account</span><span>${SVC[d.svc].gl}</span></div><div class="row"><span>Effective</span><span>${S.from?fd(S.from):"—"}${S.to?" – "+fd(S.to):" · no end"}</span></div></div>
  <div class="hr"></div><div class="sum"><div class="row"><span>Priced by</span><span>${pricedLabel(d)}</span></div><div class="row"><span>Rows</span><span class="num">${d.rows.length||"—"}</span></div>${c.tot?`<div class="row"><span>Priced</span><span class="num">${c.tot-c.un} of ${c.tot}</span></div>`:""}</div>
  <div>${c.un?`<span class="pill p-warn">${c.un} not priced</span>`:priceCols(d)?'<span class="pill p-ok">All priced</span>':'<span class="pill p-info">Entered when used</span>'}</div>
  <div class="crumb">${S.saved?"Saved.":"Nothing saved yet."}</div>`;}
function wizScreen(){const add=S.scr==="add",d=D();
 return `<header class="head"><div><div class="crumb"><button data-scr="list">Plans &amp; Rates › Charge codes</button>${add?"":` › <button data-scr="view">${d.code}</button>`}</div><h1>${add?"New charge code":"Edit "+d.code}</h1></div><div style="display:flex;gap:8px"><button class="btn" data-scr="${add?"list":"view"}">Cancel</button></div></header>
 <nav class="rail" aria-label="Steps">${STEPS.map((s,i)=>{const st=i<S.step?"done":i===S.step?"current":"todo";return `<button data-go="${i}" data-state="${st}" aria-current="${i===S.step?"step":"false"}"><span class="n">${st==="done"?"✓":i+1}</span><span class="lbl">${s}</span></button>`}).join("")}</nav>
 <div class="grid"><main class="stack">${[step1,step2,step3][S.step]()}</main><aside class="aside"><div class="panel" id="sumPanel">${summary()}</div></aside></div>`;}

/* ---------- state changes ---------- */
function freshRows(d){const pc=priceCols(d);d.rows=!pc?[]:pc.rowKey==="size"?sizesOf(d).slice(0,3).map(z=>({size:z})):pc.rowKey==="cls"?CLASSES.slice(0,2).map(c=>({cls:c})):[{size:"All"}]}
function newDraft(){const d=R({kind:"base",code:"",desc:"",svc:"battery",cls:"All",asset:"Behind-the-meter battery",type:"Recurring",auto:true});freshRows(d);return d}
function setKind(k){const d=D();d.kind=k;d.code="";d.desc="";d.type=typeOpts(k)[0];d.part=d.charged=undefined;
 if(k==="base"){d.svc="battery";d.cls="All";d.asset=assetsOf("battery")[0];d.auto=true}else{d.svc="any";d.pricedBy=k==="plan"?"class":"one";d.asset="";d.amountWhen="now";d.auto=k==="plan"}
 freshRows(d)}
function setSvc(k){const d=D();d.svc=k;d.code="";d.desc="";d.asset=assetsOf(k)[0]||"";freshRows(d)}
function render(){
 document.querySelectorAll(".demo [data-scr]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.scr===S.scr));
 $("#exPick").value=S.ex;
 $("#screen").innerHTML=S.scr==="list"?listScreen():S.scr==="view"?viewScreen():wizScreen();}
function go(scr){S.scr=scr;S.step=0;S.combo=false;S.cq="";S.saved=false;S.whyErr=false;S.why="";S.to="";
 if(scr==="add")S.d=newDraft();
 if(scr==="edit"){S.d=clone(EX[S.ex]);S.from="2026-11-01"}
 if(scr==="view")S.view="overview";render();window.scrollTo(0,0);}
const refresh=()=>{const sp=$("#sumPanel");if(sp)sp.innerHTML=summary();const wn=$("#wn");if(wn)wn.innerHTML=warnNotes(D())};

document.addEventListener("click",e=>{const t=e.target;
 const pk=t.closest("[data-pick]");if(pk){if(pk.getAttribute("aria-disabled")==="true")return;const c=SETTINGS.find(x=>x[0]===pk.dataset.pick);D().code=c[0];D().desc=c[1];S.combo=false;S.cq="";render();return}
 if(S.combo&&!t.closest("#combo")){S.combo=false;S.cq="";render();if(!t.closest("[data-scr],[data-go],[data-next],[data-back]"))return}
 const sc=t.closest("[data-scr]");if(sc){go(sc.dataset.scr);return}
 const op=t.closest("[data-open]");if(op){const k=exKey(op.dataset.open);if(k)S.ex=k;go("view");return}
 const fl=t.closest("[data-filter]");if(fl){S.filter=fl.dataset.filter;render();return}
 const vw=t.closest("[data-view]");if(vw){S.view=vw.dataset.view;render();return}
 if(t.closest("#codeQ")&&!S.combo){S.combo=true;S.cq="";render();$("#codeQ").focus();return}
 const g=t.closest("[data-go]");if(g){S.step=Number(g.dataset.go);render();return}
 if(t.closest("[data-next]")){S.step++;render();window.scrollTo(0,0);return}
 if(t.closest("[data-back]")){S.step--;render();return}
 if(t.closest("[data-save]")){if(!S.from||(S.scr==="edit"&&!S.why.trim())){S.whyErr=S.scr==="edit"&&!S.why.trim();S.fromErr=!S.from;render();return}S.fromErr=false;S.whyErr=false;S.saved=true;render();return}
 const rm=t.closest("[data-rmi]");if(rm){D().rows.splice(Number(rm.dataset.rmi),1);render();return}
 if(t.closest("#addRow")){D().rows.push({});render();return}
});
document.addEventListener("change",e=>{const t=e.target,d=D();
 if(t.id==="exPick"){S.ex=t.value;go(S.scr==="add"?"add":S.scr);return}
 if(t.dataset&&t.dataset.key!==undefined){const pc=priceCols(d);d.rows[Number(t.dataset.key)][pc.rowKey]=t.value;render();return}
 const map={kind:()=>setKind(t.value),svc:()=>setSvc(t.value),cls:()=>{d.cls=t.value},asset:()=>{d.asset=t.value;freshRows(d)},
  ty:()=>{d.type=t.value;d.part=d.charged=undefined;if(t.value==="Deposit")d.pricedBy="class";freshRows(d)},pby:()=>{d.pricedBy=t.value;if(t.value==="size")d.asset=d.svc==="any"?"Meter":(assetsOf(d.svc)[0]||"Meter");freshRows(d)},
  amw:()=>{d.amountWhen=t.value;freshRows(d)},part:()=>{d.part=t.value},charged:()=>{d.charged=t.value},
  tax:()=>{d.tax=t.value==="yes"},auto:()=>{d.auto=t.value==="yes"},waive:()=>{d.waive=t.value==="yes"},own:()=>{d.own=t.value==="yes"},
  from:()=>{S.from=t.value},to:()=>{S.to=t.value}};
 if(map[t.id]){map[t.id]();render();}
});
document.addEventListener("input",e=>{const t=e.target,d=D();
 if(t.id==="q"){S.q=t.value;const p=t.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(p,p);return}
 if(t.id==="codeQ"){S.cq=t.value;S.combo=true;const p=t.selectionStart;render();const q=$("#codeQ");q.focus();q.setSelectionRange(p,p);return}
 if(t.id==="desc"){d.desc=t.value;const nb=document.querySelector("[data-next]");if(nb)nb.disabled=!d.code.trim()||!d.desc.trim();refresh();return}
 if(t.dataset&&t.dataset.ri!==undefined){d.rows[Number(t.dataset.ri)][t.dataset.c]=t.value.trim();t.classList.toggle("zero",t.value.trim()!==""&&Number(t.value)===0);refresh();return}
 if(t.id==="why"){S.why=t.value;return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.combo){S.combo=false;S.cq="";render()}});
render();
})();
</script>
